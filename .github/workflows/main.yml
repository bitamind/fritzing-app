# This is a basic workflow to help you get started with Actions

name: Build Fritzing main on Windows

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the develop branch
  push:
    branches: [ main ]
  #pull_request:
  #  branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release
  BOOST_VERSION: 1.85.0
  BOOST_VERSION_: 1_85_0
  #BOOST_EXROOT: ${{github.workspace}}/..
  QT_VERSION: 6.5.3
  #QT_EXROOT: ${{ github.workspace }}/../Qt
  NGSPICE_VERSION: 42
  #NGSPICE_EXROOT: ${{ github.workspace }}/..
  LIBGIT2_VERSION: 0.28.5
  #LIBGIT2_EXROOT: ${{ github.workspace }}/..
  CLIPPER1_VERSION: 6.4.2
  #CLIPPER1_EXROOT: ${{ github.workspace }}/..
  QUAZIP_VERSION: 1.4
  #QUAZIP_EXROOT: ${{ github.workspace }}/..
  SVGPP_VERSION: 1.3.1
  #SVGPP_EXROOT: ${{ github.workspace }}/..
  GITHUB_WORKSPACE: ${{github.workspace}}

permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: windows-2022

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64

    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4
      with:
        ref: develop
        submodules: recursive

    # Runs a single command using the runners shell
    #- name: Run a one-line script
    #  run: echo Hello, world!

    # Runs a set of commands using the runners shell
    #- name: Run a multi-line script
    #  run: |
    #    echo Add other actions to build,
    #    echo test, and deploy your project.

    - name: Set EXROOT
      shell: bash
      run: |
        echo "BOOST_EXROOT=$(dirname ${GITHUB_WORKSPACE})" >> ${GITHUB_ENV}
        echo "QT_EXROOT=$(dirname ${GITHUB_WORKSPACE})" >> ${GITHUB_ENV}
        echo "NGSPICE_EXROOT=$(dirname ${GITHUB_WORKSPACE})" >> ${GITHUB_ENV}
        echo "LIBGIT2_EXROOT=$(dirname ${GITHUB_WORKSPACE})" >> ${GITHUB_ENV}
        echo "CLIPPER1_EXROOT=$(dirname ${GITHUB_WORKSPACE})" >> ${GITHUB_ENV}
        echo "QUAZIP_EXROOT=$(dirname ${GITHUB_WORKSPACE})" >> ${GITHUB_ENV}
        echo "SVGPP_EXROOT=$(dirname ${GITHUB_WORKSPACE})" >> ${GITHUB_ENV}

    #- name: Restore NuGet packages
    #  working-directory: ${{env.GITHUB_WORKSPACE}}
    #  run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    #- name: Cache Qt
    #  id: cache-qt
    #  uses: actions/cache@v3  # not v2!
    #  with:
    #    path: ${{env.QT_ROOT}}
    #    key: ${{ runner.os }}-${{env.QT_VERSION}}-QtCache

    - name: Install Qt ${{env.QT_VERSION}}
      if: steps.cache-qt.outputs.cache-hit != 'true'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{env.QT_VERSION}}
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qt5compat qtserialport'
        cached: ${{ steps.cache-qt.outputs.cache-hit }}

    - name: Update the translations files
      shell: cmd
      run: |
        call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        lupdate -noobsolete phoenix.pro
        lrelease -removeidentical phoenix.pro

    - name: Restore Boost cache
      uses: actions/cache@v3
      id: cache-boost
      with:
        path: ${{env.BOOST_EXROOT}}/boost_${{ env.BOOST_VERSION_ }}
        key: boost-${{ runner.os }}-${{ env.BOOST_VERSION }}

    - name: Install Boost
      if: steps.cache-boost.outputs.cache-hit != 'true'
      env: 
        BOOST_URL: https://sourceforge.net/projects/boost/files/boost/${{ env.BOOST_VERSION }}/boost_${{ env.BOOST_VERSION_ }}.7z/download
      shell: bash
      run: |
        if [ "${OS}" == "Windows_NT" ]; then
          # fix up paths to be forward slashes consistently
          BOOST_EXROOT=$(echo ${BOOST_EXROOT} | sed 's/\\/\//g')
        fi
        mkdir -p ${BOOST_EXROOT}
        curl --progress-bar --location --output ${BOOST_EXROOT}/download.7z ${BOOST_URL}
        7z -o${BOOST_EXROOT} x ${BOOST_EXROOT}/download.7z -y -bd
        rm ${BOOST_EXROOT}/download.7z
        cd ${BOOST_EXROOT}
        #ls ${BOOST_EXROOT}
        echo "BOOST_ROOT=${BOOST_EXROOT}/boost_${{ env.BOOST_VERSION_ }}" >> ${GITHUB_ENV}

    - name: Install vcpkg
      shell: bash
      run: |
        vcpkg.exe install zlib
        echo "VCPKG_INSTALLED=${VCPKG_INSTALLATION_ROOT}/installed/x64-windows" >> ${GITHUB_ENV}
        echo "PATH=${VCPKG_INSTALLED}/bin;${PATH}" >> ${GITHUB_ENV}

    - name: Download prebuilt ngspice
      env: 
        NGSPICE_URL: https://sourceforge.net/projects/ngspice/files/ng-spice-rework/old-releases/${{ env.NGSPICE_VERSION }}/ngspice-${{ env.NGSPICE_VERSION }}_dll_64.7z/download
      shell: bash
      run: |
        if [ "${OS}" == "Windows_NT" ]; then
          # fix up paths to be forward slashes consistently
          NGSPICE_EXROOT=$(echo ${NGSPICE_EXROOT} | sed 's/\\/\//g')
        fi
        #mkdir -p ${NGSPICE_EXROOT}
        curl --progress-bar --location --output ${NGSPICE_EXROOT}/ngspice_dll.7z ${NGSPICE_URL}
        7z -o${NGSPICE_EXROOT} x ${NGSPICE_EXROOT}/ngspice_dll.7z -y -bd
        rm ${NGSPICE_EXROOT}/ngspice_dll.7z
        cd ${NGSPICE_EXROOT}
        mv Spice64_dll/ ngspice-${{ env.NGSPICE_VERSION }}/

    - name: Restore libgit2 cache
      uses: actions/cache@v3
      id: cache-libgit2
      with:
        path: ${{env.LIBGIT2_EXROOT}}/libgit2
        key: libgit2-${{ runner.os }}-${{ env.LIBGIT2_VERSION }}

    - name: Build libgit2
      if: steps.cache-libgit2.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd ${LIBGIT2_EXROOT}
        git clone -b v${{ env.LIBGIT2_VERSION }} --depth 1 https://github.com/libgit2/libgit2
        cd libgit2
        cmake -S . -B build64 -G "Visual Studio 17 2022" -A x64 -DBUILD_CLAR=OFF
        cmake --build build64 --config Release

    - name: Restore clipper1 cache
      uses: actions/cache@v3
      id: cache-clipper1
      with:
        path: ${{env.CLIPPER1_EXROOT}}/Clipper1-${{ env.CLIPPER1_VERSION }}
        key: clipper1-${{ runner.os }}-${{ env.CLIPPER1_VERSION }}

    - name: Build clipper1
      if: steps.cache-clipper1.outputs.cache-hit != 'true'
      env: 
        CLIPPER1_URL: https://sourceforge.net/projects/polyclipping/files/clipper_ver${{ env.CLIPPER1_VERSION }}.zip/download
      shell: bash
      run: |
        if [ "${OS}" == "Windows_NT" ]; then
          # fix up paths to be forward slashes consistently
          CLIPPER1_EXROOT=$(echo ${CLIPPER1_EXROOT} | sed 's/\\/\//g')
        fi
        #mkdir -p ${CLIPPER1_EXROOT}
        curl --progress-bar --location --output ${CLIPPER1_EXROOT}/clipper1.zip ${CLIPPER1_URL}
        7z -o${CLIPPER1_EXROOT}/Clipper1 x ${CLIPPER1_EXROOT}/clipper1.zip -y -bd
        rm ${CLIPPER1_EXROOT}/clipper1.zip
        cd ${CLIPPER1_EXROOT}
        mv Clipper1/cpp/ Clipper1-${{ env.CLIPPER1_VERSION }}/
        cd Clipper1-${{ env.CLIPPER1_VERSION }}
        cmake -S . -B build64 -G "Visual Studio 17 2022" -A x64 -DBUILD_SHARED_LIBS=OFF
        cmake --build build64 --config Release
        #cmake --install build64 --prefix ${CLIPPER1_EXROOT}/Clipper1-${{ env.CLIPPER1_VERSION }}
        mkdir -p include/polyclipping
        mkdir -p lib
        cp -t include/polyclipping/ clipper.hpp
        cp -t lib/ build64/Release/*

    - name: Copy clipper1
      shell: bash
      run: |
        mkdir -p include/polyclipping
        mkdir -p lib
        cp -pr -t include/polyclipping/ ../Clipper1-${{ env.CLIPPER1_VERSION }}/include/polyclipping/clipper.hpp
        cp -pr -t lib/ ../Clipper1-${{ env.CLIPPER1_VERSION }}/lib/*

    - name: Restore svgpp cache
      uses: actions/cache@v3
      id: cache-svgpp
      with:
        path: ${{env.SVGPP_EXROOT}}/svgpp-${{ env.SVGPP_VERSION }}
        key: svgpp-${{ runner.os }}-${{ env.SVGPP_VERSION }}

    - name: Build svgpp
      if: steps.cache-svgpp.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd ${SVGPP_EXROOT}
        git clone -b v${{ env.SVGPP_VERSION }} --depth 1 https://github.com/svgpp/svgpp svgpp-${{ env.SVGPP_VERSION }}
        #cd svgpp-${{ env.SVGPP_VERSION }}/src
        #cmake -S . -B build64 -G "Visual Studio 17 2022" -A x64
        #cmake --build build64 --config Release

    - name: Copy svgpp
      shell: bash
      run: |
        mkdir -p include
        cp -pr -t include/ ../svgpp-${{ env.SVGPP_VERSION }}/include/*

    - name: Restore quazip cache
      uses: actions/cache@v3
      id: cache-quazip
      with:
        path: ${{env.QUAZIP_EXROOT}}/quazip-${{ env.QT_VERSION }}-${{ env.QUAZIP_VERSION }}intuisphere
        key: quazip-${{ runner.os }}-${{ env.QUAZIP_VERSION }}

    - name: Build quazip
      if: steps.cache-quazip.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd ${QUAZIP_EXROOT}
        git clone -b v${{ env.QUAZIP_VERSION }} --depth 1 https://github.com/stachenov/quazip quazip-${{ env.QT_VERSION }}-${{ env.QUAZIP_VERSION }}intuisphere
        cd quazip-${{ env.QT_VERSION }}-${{ env.QUAZIP_VERSION }}intuisphere
        cmake -S . -B build64 -G "Visual Studio 17 2022" -A x64 -D ZLIB_LIBRARY=${VCPKG_INSTALLED}/lib/zlib.lib -D ZLIB_INCLUDE_DIR=${VCPKG_INSTALLED}/include
        cmake --build build64 --config Release
        mkdir -p include/QuaZip-Qt6-${{ env.QUAZIP_VERSION }}/quazip/
        mkdir -p lib
        cp -t include/QuaZip-Qt6-${{ env.QUAZIP_VERSION }}/quazip/ quazip/*.h
        cp -t lib/ build64/quazip/Release/*

    - name: Build Fritzing
      working-directory: ${{env.GITHUB_WORKSPACE}}
      env:
        PATH: "${{ env.WindowsSdkVerBinPath }}/x86;${{ env.PATH }}"
      shell: cmd
      run: |
        call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        qmake -o Makefile phoenix.pro QMAKE_TARGET.arch=x86_64 || exit /b 1
        nmake release || exit /b 2
        dir ..
        dir ..\release64 /s

    - name: Package artifact
      shell: bash
      run: |
        mkdir Fritzing-${{ github.ref_name }} && cd "$_"
        cp -pr -t ./ ../../release64/Fritzing.exe{,.manifest}
        cp -pr -t ./ ../{translations,sketches,help}
        cp -pr -t ./ ../{README.md,INSTALL.txt}
        cp -pr -t ./ ../LICENSE{.CC-BY-SA,.GPL2,.GPL3}
        cp -pr -t ./ ${LIBGIT2_EXROOT}/libgit2/build64/Release/git2.dll
        cp -pr -t ./ ${VCPKG_INSTALLED}/bin/zlib1.dll
        cp -pr -t ./ ${QT_ROOT_DIR}/bin/Qt6Core5Compat.dll
        git clone --branch main --depth 1 https://github.com/fritzing/fritzing-parts.git
        #./Fritzing.exe -pp ./fritzing-parts -db ./fritzing-parts/parts.db
        ${QT_ROOT_DIR}/bin/windeployqt6.exe Fritzing.exe
        ls ${GITHUB_WORKSPACE}/..
        ls -R ${GITHUB_WORKSPACE}
        #7z a "Fritzing-${{ github.ref_name }}.7z" "Fritzing-${{ github.ref_name }}"

    # Upload package: https://github.com/marketplace/actions/upload-artifact
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Fritzing-${{ github.ref_name }}-${{ runner.os }}
        path: ${{ github.workspace }}/Fritzing-${{ github.ref_name }}
